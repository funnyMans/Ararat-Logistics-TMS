name: tms-local

services:
  api-gateway:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - '127.0.0.1:${API_GATEWAY_HOST_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "require(''http'').get(''http://127.0.0.1:3000/ready'', res => { process.exit(res.statusCode >= 200 && res.statusCode < 400 ? 0 : 1); }).on(''error'', () => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    restart: unless-stopped
    image: nginx:1.25-alpine
    ports:
      - '127.0.0.1:${NGINX_HOST_PORT:-8080}:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:80/health']
      interval: 15s
      timeout: 5s
      retries: 5

  tempo:
    restart: unless-stopped
    image: grafana/tempo:2.6.1
    command: ['-config.file=/etc/tempo.yaml']
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  otel-collector:
    restart: unless-stopped
    image: otel/opentelemetry-collector-contrib:0.78.0
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    volumes:
      - ./otel-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - tempo

  prometheus:
    restart: unless-stopped
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    ports:
      - '127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    depends_on:
      - api-gateway

  grafana:
    restart: unless-stopped
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports:
      - '127.0.0.1:${GRAFANA_HOST_PORT:-3005}:3000'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foundation_conformance}
      POSTGRES_USER: ${POSTGRES_USER:-foundation_test}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foundation_test}
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  temporal-postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal_test
      POSTGRES_PASSWORD: temporal_test
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  temporal:
    restart: unless-stopped
    image: temporalio/auto-setup:1.27.2
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal_test
      POSTGRES_PWD: temporal_test
      POSTGRES_SEEDS: temporal-postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/docker.yaml
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    ports:
      - '127.0.0.1:${TEMPORAL_HOST_PORT:-7233}:7233'
    depends_on:
      temporal-postgres:
        condition: service_healthy

  rabbitmq:
    restart: unless-stopped
    image: rabbitmq:4.1.3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: foundation_test
      RABBITMQ_DEFAULT_PASS: foundation_test
    ports:
      - '127.0.0.1:${RABBITMQ_HOST_PORT:-5672}:5672'
      - '127.0.0.1:${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  capacity-commitment-postgres:
    profiles: ['capacity-commitment']
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: capacity_commitment
      POSTGRES_USER: capacity_migrator
      POSTGRES_PASSWORD: ${CAPACITY_MIGRATION_DB_PASSWORD:-capacity_migration_local_only}
      CAPACITY_RUNTIME_DB_PASSWORD: ${CAPACITY_RUNTIME_DB_PASSWORD:-capacity_runtime_local_only_2026}
    volumes:
      - capacity-commitment-postgres-data:/var/lib/postgresql/data
      - ../services/capacity-commitment/infra/postgres-init.sql:/docker-entrypoint-initdb.d/001-capacity-runtime-role.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  capacity-commitment-rabbitmq:
    profiles: ['capacity-commitment']
    restart: unless-stopped
    image: rabbitmq:4.1.3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${CAPACITY_RABBITMQ_ADMIN_USER:-capacity_admin}
      RABBITMQ_DEFAULT_PASS: ${CAPACITY_RABBITMQ_ADMIN_PASSWORD:-capacity_admin_local_only_2026}
    volumes:
      - capacity-commitment-rabbitmq-data:/var/lib/rabbitmq
    ports:
      - '127.0.0.1:${CAPACITY_RABBITMQ_HOST_PORT:-5673}:5672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  capacity-commitment-migrate:
    profiles: ['capacity-commitment']
    build:
      context: ..
      dockerfile: services/capacity-commitment/Dockerfile
    command: ['node', 'services/capacity-commitment/dist/migrate.js']
    environment:
      CAPACITY_MIGRATION_DATABASE_URL: postgresql://capacity_migrator:${CAPACITY_MIGRATION_DB_PASSWORD:-capacity_migration_local_only}@capacity-commitment-postgres:5432/capacity_commitment
    depends_on:
      capacity-commitment-postgres:
        condition: service_healthy

  capacity-commitment-provision:
    profiles: ['capacity-commitment']
    build:
      context: ..
      dockerfile: services/capacity-commitment/Dockerfile
    command: ['node', 'services/capacity-commitment/dist/provision-topology.js']
    environment:
      CAPACITY_RABBITMQ_ADMIN_AMQP_URL: amqp://${CAPACITY_RABBITMQ_ADMIN_USER:-capacity_admin}:${CAPACITY_RABBITMQ_ADMIN_PASSWORD:-capacity_admin_local_only_2026}@capacity-commitment-rabbitmq:5672/
      CAPACITY_RABBITMQ_MANAGEMENT_API_URL: http://capacity-commitment-rabbitmq:15672/api
      CAPACITY_RABBITMQ_ADMIN_USER: ${CAPACITY_RABBITMQ_ADMIN_USER:-capacity_admin}
      CAPACITY_RABBITMQ_ADMIN_PASSWORD: ${CAPACITY_RABBITMQ_ADMIN_PASSWORD:-capacity_admin_local_only_2026}
      CAPACITY_RABBITMQ_APP_USER: ${CAPACITY_RABBITMQ_APP_USER:-capacity_runtime}
      CAPACITY_RABBITMQ_APP_PASSWORD: ${CAPACITY_RABBITMQ_APP_PASSWORD:-capacity_broker_runtime_local_only_2026}
    depends_on:
      capacity-commitment-rabbitmq:
        condition: service_healthy

  capacity-commitment:
    profiles: ['capacity-commitment']
    restart: unless-stopped
    build:
      context: ..
      dockerfile: services/capacity-commitment/Dockerfile
    environment:
      CAPACITY_DATABASE_URL: postgresql://capacity_runtime:${CAPACITY_RUNTIME_DB_PASSWORD:-capacity_runtime_local_only_2026}@capacity-commitment-postgres:5432/capacity_commitment
      CAPACITY_AMQP_URL: amqp://${CAPACITY_RABBITMQ_APP_USER:-capacity_runtime}:${CAPACITY_RABBITMQ_APP_PASSWORD:-capacity_broker_runtime_local_only_2026}@capacity-commitment-rabbitmq:5672/capacity_commitment
      CAPACITY_COMMAND_QUEUE: capacity.commitment.commands
      CAPACITY_OUTCOME_EXCHANGE: capacity.commitment.outcomes
      CAPACITY_HTTP_HOST: 0.0.0.0
      CAPACITY_HTTP_PORT: 8080
      CAPACITY_WORKER_POLL_INTERVAL_MS: 1000
    ports:
      - '127.0.0.1:${CAPACITY_HTTP_HOST_PORT:-8086}:8080'
    depends_on:
      capacity-commitment-postgres:
        condition: service_healthy
      capacity-commitment-rabbitmq:
        condition: service_healthy
      capacity-commitment-migrate:
        condition: service_completed_successfully
      capacity-commitment-provision:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/ready').then(res => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  operational-economics-postgres:
    profiles: ['operational-economics']
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: operational_economics
      POSTGRES_USER: economics_migrator
      POSTGRES_PASSWORD: ${ECONOMICS_MIGRATION_DB_PASSWORD:-economics_migration_local_only}
      ECONOMICS_RUNTIME_DB_PASSWORD: ${ECONOMICS_RUNTIME_DB_PASSWORD:-economics_runtime_local_only_2026}
    volumes:
      - operational-economics-postgres-data:/var/lib/postgresql/data
      - ../services/operational-economics/infra/postgres-init.sql:/docker-entrypoint-initdb.d/001-economics-runtime-role.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  operational-economics-migrate:
    profiles: ['operational-economics']
    build:
      context: ..
      dockerfile: services/operational-economics/Dockerfile
    command: ['node', 'services/operational-economics/dist/migrate.js']
    environment:
      ECONOMICS_MIGRATION_DATABASE_URL: postgresql://economics_migrator:${ECONOMICS_MIGRATION_DB_PASSWORD:-economics_migration_local_only}@operational-economics-postgres:5432/operational_economics
    depends_on:
      operational-economics-postgres:
        condition: service_healthy

  operational-economics:
    profiles: ['operational-economics']
    restart: unless-stopped
    build:
      context: ..
      dockerfile: services/operational-economics/Dockerfile
    environment:
      ECONOMICS_DATABASE_URL: postgresql://economics_runtime:${ECONOMICS_RUNTIME_DB_PASSWORD:-economics_runtime_local_only_2026}@operational-economics-postgres:5432/operational_economics
      ECONOMICS_HTTP_HOST: 0.0.0.0
      ECONOMICS_HTTP_PORT: 8080
    ports:
      - '127.0.0.1:${ECONOMICS_HTTP_HOST_PORT:-8087}:8080'
    depends_on:
      operational-economics-postgres:
        condition: service_healthy
      operational-economics-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/ready').then(res => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nats:
    restart: unless-stopped
    image: nats:2.10.24-alpine
    command: ['--http_port', '8222']
    ports:
      - '127.0.0.1:${NATS_HOST_PORT:-4222}:4222'
      - '127.0.0.1:${NATS_MONITOR_HOST_PORT:-8222}:8222'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8222/healthz']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  prometheus-data:
  grafana-data:
  tempo-data:
  postgres-data:
  temporal-postgres-data:
  rabbitmq-data:
  capacity-commitment-postgres-data:
  capacity-commitment-rabbitmq-data:
  operational-economics-postgres-data:
