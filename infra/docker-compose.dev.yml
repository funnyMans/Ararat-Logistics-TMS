name: tms-local

services:
  api-gateway:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "require(''http'').get(''http://127.0.0.1:3000/ready'', res => { process.exit(res.statusCode >= 200 && res.statusCode < 400 ? 0 : 1); }).on(''error'', () => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    restart: unless-stopped
    image: nginx:1.25-alpine
    ports:
      - '127.0.0.1:8080:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:80/health']
      interval: 15s
      timeout: 5s
      retries: 5

  tempo:
    restart: unless-stopped
    image: grafana/tempo:2.6.1
    command: ['-config.file=/etc/tempo.yaml']
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  otel-collector:
    restart: unless-stopped
    image: otel/opentelemetry-collector-contrib:0.78.0
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    volumes:
      - ./otel-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - tempo

  prometheus:
    restart: unless-stopped
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    depends_on:
      - api-gateway

  grafana:
    restart: unless-stopped
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports:
      - '127.0.0.1:3005:3000'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
  tempo-data:
